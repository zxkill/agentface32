name: Build firmware profiles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - m5stack-basic
          - esp32dev-ssd1306
          - esp32dev-ssd1306-max98357
          - esp32dev-sh1106
          - esp32s3-ssd1306
          - lilygo-t-display
          - esp32dev-st7789

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build ${{ matrix.environment }}
        run: pio run -e "${{ matrix.environment }}"
