[platformio]
default_envs = m5stack-basic

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson
build_flags =
    -D CORE_DEBUG_LEVEL=1

; ---------------------------------------------------------------------------
; Rich reference build: M5Stack Basic / Core ESP32
; 320x240 display, 3 buttons, built-in speaker and Russian speech pack.
; ---------------------------------------------------------------------------
[env:m5stack-basic]
board = m5stack-core-esp32
board_build.partitions = partitions.csv
board_upload.maximum_size = 3145728
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified
build_flags =
    ${env.build_flags}
    -D PROFILE_M5STACK_BASIC

; ---------------------------------------------------------------------------
; Most common DIY build: ESP32 DevKit + 0.96" SSD1306 128x64 I2C OLED.
; Defaults: SDA=21, SCL=22, optional passive buzzer on GPIO26.
; ---------------------------------------------------------------------------
[env:esp32dev-ssd1306]
board = esp32dev
lib_deps =
    ${env.lib_deps}
    olikraus/U8g2
build_flags =
    ${env.build_flags}
    -D PROFILE_ESP32_SSD1306
    -D AGENT_AUDIO_BACKEND=AGENT_AUDIO_PIEZO

; Same hardware with a MAX98357A I2S amplifier instead of a piezo buzzer.
[env:esp32dev-ssd1306-max98357]
board = esp32dev
lib_deps =
    ${env.lib_deps}
    olikraus/U8g2
build_flags =
    ${env.build_flags}
    -D PROFILE_ESP32_SSD1306
    -D AGENT_AUDIO_BACKEND=AGENT_AUDIO_MAX98357

; 1.3" SH1106 128x64 OLED variant.
[env:esp32dev-sh1106]
board = esp32dev
lib_deps =
    ${env.lib_deps}
    olikraus/U8g2
build_flags =
    ${env.build_flags}
    -D PROFILE_ESP32_SH1106
    -D AGENT_AUDIO_BACKEND=AGENT_AUDIO_PIEZO

; Modern ESP32-S3 DevKit + SSD1306. Defaults: SDA=8, SCL=9.
[env:esp32s3-ssd1306]
board = esp32-s3-devkitc-1
lib_deps =
    ${env.lib_deps}
    olikraus/U8g2
build_flags =
    ${env.build_flags}
    -D PROFILE_ESP32_SSD1306
    -D OLED_SDA_PIN=8
    -D OLED_SCL_PIN=9
    -D PIEZO_PIN=4
    -D AGENT_AUDIO_BACKEND=AGENT_AUDIO_PIEZO

; ---------------------------------------------------------------------------
; LILYGO TTGO T-Display (classic ESP32, 240x135 ST7789, two built-in buttons).
; Pinout follows LILYGO's official T-Display documentation.
; ---------------------------------------------------------------------------
[env:lilygo-t-display]
board = lilygo-t-display
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI
build_flags =
    ${env.build_flags}
    -D PROFILE_LILYGO_TDISPLAY
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=40000000
    -D TFT_ROTATION=1
    -D AGENT_AUDIO_BACKEND=AGENT_AUDIO_NONE

; ---------------------------------------------------------------------------
; Generic ESP32 DevKit + 240x240 SPI ST7789.
; Default wiring: MOSI=23 SCLK=18 CS=5 DC=16 RST=17 BL=4.
; Copy this environment and change the pin build flags for your module.
; ---------------------------------------------------------------------------
[env:esp32dev-st7789]
board = esp32dev
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI
build_flags =
    ${env.build_flags}
    -D PROFILE_ESP32_ST7789
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=17
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=40000000
    -D TFT_ROTATION=0
    -D AGENT_AUDIO_BACKEND=AGENT_AUDIO_PIEZO
